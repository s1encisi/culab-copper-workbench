[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copper-electrolysis-electrowinning-mas"
version = "0.4.0"
description = "铜电解—电积历史数据多智能体正式研究工程"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "numpy>=1.26,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
mvp = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymoo>=0.6.1,<0.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
