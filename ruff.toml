# 铜电解电积多智能体工程 —— 代码风格与静态检查标准
# 声明日期：2026-09-23（项目结构整理时确立）
#
# 背景：本项目此前未声明行宽与静态检查标准，导致风格漂移（最长行 1247 字符、
# 277 处单行分号、3060 处超长行）。本文件确立当前可执行的强制基线，
# 历史量化数据见 docs/代码质量基线_20260923.md；本次执行见 docs/后续实施验收_20260923.md。
#
# 工具版本要求：请使用 ruff >= 0.15。
#   0.12.0 等旧版仍保留 UP038（isinstance 元组写法）规则，会在 src/ 多报
#   26 条假阳性；该规则已在新版中废弃移除。经 0.15.21 复核，基线全绿。

target-version = "py311"

# P2 迁移完成：120 字符行宽、导入排序、单行多语句、zip 与闭包规则纳入强制检查。
line-length = 120

[lint]
# 强制基线：导入位置（E4）、语法（E9）、正确性（F）、空白（W）、
# 语法现代化（UP）、推导式简化（C4）。当前该基线在 src/tests/scripts 全部通过。
select = ["E4", "E9", "F", "W", "UP", "C4", "I001", "E501", "E701", "E702", "B905", "B023"]

ignore = [
    # 未使用变量（8 处）已逐条人工复核，保留原状以免掩盖真实问题：
    #   - model_lifecycle.approve、research_store.create_task/control：
    #     属权限与存在性校验调用，副作用有效，不可删除；
    #   - model_training 的 X_valid：指向尚未接通的验证路径，待补全。
    "F841",
    # 刻意延迟导入：src 中为可选重型依赖（torch/pymc/onnxruntime 等），
    # scripts 中为运行前路径引导（sys.path 设置）之后的导入。
    "E402",
]

[lint.per-file-ignores]
# 测试保留显式导入以体现被测对象与夹具来源。
"tests/**" = ["F401"]
